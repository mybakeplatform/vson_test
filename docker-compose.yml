## Local development stack: Postgres plus the app.
##
##   docker compose up --build
##   open http://localhost:3000
##
## The app migrates and seeds itself on boot, so this is the whole setup.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mybake
      POSTGRES_PASSWORD: mybake
      POSTGRES_DB: mybake
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mybake -d mybake']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mybake:mybake@db:5432/mybake
      PORT: '3000'
      SEED_PASSWORD: test-password
      CORS_ORIGINS: '*'
    ports:
      - '3000:3000'

volumes:
  pgdata:
